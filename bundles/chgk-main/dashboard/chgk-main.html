<!doctype html>
<html lang="en" data-bs-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
			crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
		<link rel="stylesheet" href="main.css" />
	</head>
	<body>
		<div id="app">
			<div class="row">
				<div class="col-4">
					<div class="score">
						<div class="score-headers">
							<span>ЗНАТОКИ</span>
							<span>СЕКТОРА</span>
						</div>
						<div class="scores">
							<div class="vertical-btn-group">
								<button
									class="side-button side-button-left"
									@click="addScore('experts', 1)"
									:disabled="score.experts >= 6">
									+
								</button>
								<button
									class="side-button side-button-left"
									@click="addScore('experts', -1)"
									:disabled="score.experts <= 0">
									−
								</button>
							</div>
							<div class="left-score" @click="addScore('experts', 1)">
								<span class="no-select">{{ score.experts }}</span>
							</div>
							<div class="right-score" @click="addScore('sectors', 1)">
								<span class="no-select">{{ score.sectors }}</span>
							</div>
							<div class="vertical-btn-group">
								<button
									class="side-button side-button-right"
									@click="addScore('sectors', 1)"
									:disabled="score.sectors >= 6">
									+
								</button>
								<button
									class="side-button side-button-right"
									@click="addScore('sectors', -1)"
									:disabled="score.sectors <= 0">
									−
								</button>
							</div>
						</div>
					</div>
					<div class="btn-group btn-group-flex mt-3" role="group">
						<button
							type="button"
							class="btn btn-light"
							:disabled="score.experts >= 6"
							@click="addScore('experts', 1)">
							+ 1 Знатокам
						</button>
						<button
							type="button"
							class="btn btn-primary"
							:disabled="score.sectors >= 6"
							@click="addScore('sectors', 1)">
							+ 1 Секторам
						</button>
					</div>
					<div class="btn-group btn-group-flex mt-1" role="group">
						<button
							type="button"
							class="btn btn-outline-light"
							@click="addScore('experts', 6)"
							:disabled="score.experts >= 6">
							+ 6
						</button>
						<button type="button" class="btn btn-outline-light" @click="resetScore">0 : 0</button>
						<button
							type="button"
							class="btn btn-outline-light"
							@click="addScore('sectors', 6)"
							:disabled="score.sectors >= 6">
							+ 6
						</button>
					</div>
					<details class="mt-3">
						<summary>Настройки игры</summary>
						<p class="mt-2 mb-0">Выбрать тему оформления счёта</p>
						<div class="btn-group btn-group-flex" role="group">
							<button
								type="button"
								class="btn btn-outline-secondary"
								v-for="theme in themes"
								:key="theme.id"
								:class="{ active: gameState.currentTheme === theme.id }"
								@click="setTheme(theme.id)">
								{{ theme.label }}
							</button>
						</div>
						<p class="mt-2 mb-0">Переключить текущую игру</p>
						<div class="btn-group btn-group-flex" role="group">
							<button
								type="button"
								class="btn btn-outline-secondary"
								v-for="gameId in availableGames"
								:key="gameId"
								:class="{ active: gameState.currentGame === gameId }"
								@click="selectGame(gameId)">
								Игра № {{ gameId.substring(1) }}
							</button>
							<button type="button" class="btn btn-danger" @click="confirmClearAllGames">
								Удалить файлы
							</button>
						</div>
						<div class="card card-body mt-2">
							<div class="d-flex align-items-center mb-3">
								<span class="me-2">Номер игры для загрузки:</span>
								<input
									type="number"
									v-model.number="manualGameNumber"
									:placeholder="detectedGameNumber"
									class="form-control form-control-sm"
									style="width: 70px"
									min="1"
									max="6" />
								<small class="ms-2 text-muted">(определено по файлам: {{ detectedGameNumber }})</small>
							</div>

							<table class="table table-sm table-bordered text-center">
								<th>
									<td>Вопрос</td>
									<td>Ответ</td>
								</th>
								<tr v-for="n in 13" :key="n">
									<td><strong>{{ n }}</strong></td>

									<td>
										<div v-if="n === 5 || n === 9" class="d-flex justify-content-center gap-1">
											<template v-for="i in 3" :key="i">
												<button
													class="btn btn-xs btn-outline-secondary"
													@click="triggerUpload(n, 'q', i)">
													{{ i }}
												</button>
												<span v-if="isLoaded(n, 'q', i)">✅</span>
											</template>
										</div>
										<div v-else>
											<button
												class="btn btn-xs btn-outline-secondary"
												@click="triggerUpload(n, 'q')">
												📁
											</button>
											<span v-if="isLoaded(n, 'q')">✅</span>
										</div>
									</td>

									<td>
										<div v-if="n === 5 || n === 9" class="d-flex justify-content-center gap-1">
											<template v-for="i in 3" :key="i">
												<button
													class="btn btn-xs btn-outline-warning"
													@click="triggerUpload(n, 'a', i)">
													{{ i }}
												</button>
												<span v-if="isLoaded(n, 'a', i)">✅</span>
											</template>
										</div>
										<div v-else>
											<button
												class="btn btn-xs btn-outline-warning"
												@click="triggerUpload(n, 'a')">
												📁
											</button>
											<span v-if="isLoaded(n, 'a')">✅</span>
										</div>
									</td>
								</tr>
							</table>
						</div>
					</details>
				</div>
				<div class="col-8">
					<div class="buttons-container">
						<button
							@click="toggleScoreboard"
							:class="['btn btn-outline-info', !displayState.scoreboardExpanded ? 'active' : '']">
							{{ !displayState.scoreboardExpanded ? 'Убрать счет' : 'Показать счет' }}
						</button>
						<button
							type="button"
							:class="['btn btn-outline-info ms-2', displayState.isIntroPlaying ? 'active' : '']"
							:disabled="displayState.isIntroPlaying"
							@click="playIntro">
							{{ displayState.isIntroPlaying ? 'Заставка в эфире...' : 'Запустить заставку' }}
						</button>
						<button v-if="displayState.isIntroPlaying" @click="forceReset" class="btn btn-danger ms-1">
							✕
						</button>
					</div>
					<div class="sectors-container mt-3">
						<div class="sector" v-for="n in 13" :key="n">
							<div class="sector-header">
								<span v-if="n === 5" class="text-uppercase">Блиц</span>
								<span v-else-if="n === 9" class="text-uppercase">Суперблиц</span>
								<span v-else>Сектор {{ n }}</span>
							</div>
							<div class="sector-body">
								<template v-if="n === 5 || n === 9">
									<div class="d-flex flex-column w-100 gap-1">
										<div v-for="step in 3" :key="step" class="d-flex gap-1 align-items-center">
											<small class="text-muted" style="width: 10px">{{ step }}</small>
											<button
												type="button"
												class="btn btn-sm flex-grow-1"
												:disabled="!hasGameAsset(n, 'q', step)"
												:class="getButtonClass(n, 'q', step)"
												@click="handleMediaClick(n, 'q', step)">
												В
											</button>
											<button
												type="button"
												class="btn btn-sm flex-grow-1"
												:disabled="!hasGameAsset(n, 'a', step)"
												:class="getButtonClass(n, 'a', step)"
												@click="handleMediaClick(n, 'a', step)">
												О
											</button>
										</div>
									</div>
								</template>

								<template v-else>
									<button
										type="button"
										class="btn"
										:disabled="!hasGameAsset(n, 'q')"
										:class="getButtonClass(n, 'q')"
										@click="handleMediaClick(n, 'q')">
										В
									</button>
									<button
										type="button"
										class="btn"
										:disabled="!hasGameAsset(n, 'a')"
										:class="getButtonClass(n, 'a')"
										@click="handleMediaClick(n, 'a')">
										О
									</button>
								</template>
							</div>
						</div>
						<div class="sector remove-sector">
							<button
								type="button"
								class="btn btn-lg btn-danger"
								style="font-size: 2rem"
								@click="clearMedia">
								<i class="bi bi-x-square"></i>
							</button>
						</div>
					</div>
				</div>
			</div>
			<input type="file" ref="gridFileInput" style="display: none" @change="handleGridUpload" />
		</div>
		<!-- <div class="iframe-container">
			<iframe src="/bundles/chgk-main/graphics/index.html" frameborder="0" class="scaled-iframe"></iframe>
		</div> -->
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
			crossorigin="anonymous"></script>
		<script type="module" src="./chgk-main.js"></script>
	</body>
</html>
